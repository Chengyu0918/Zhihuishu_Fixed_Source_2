<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多层知识图谱可视化</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>多层知识图谱</h1>
        <div class="controls">
            <button id="resetBtn">重置视图</button>
            <span class="hint">点击任意节点查看其与上层的连接关系</span>
        </div>
        <div class="legend">
            <div class="legend-item"><span class="legend-color" style="background: #FFD700;"></span>能力目标</div>
            <div class="legend-item"><span class="legend-color" style="background: #FF6B6B;"></span>综合问题</div>
            <div class="legend-item"><span class="legend-color" style="background: #4ECDC4;"></span>专业课程</div>
            <div class="legend-item"><span class="legend-color" style="background: #45B7D1;"></span>高阶基础</div>
            <div class="legend-item"><span class="legend-color" style="background: #96CEB4;"></span>数理基础</div>
        </div>
        <div id="graph-container">
            <svg id="graph-svg"></svg>
        </div>
        <div id="info-panel">
            <h3>节点信息</h3>
            <div id="node-info">点击节点查看详情</div>
        </div>
    </div>
    <script src="data.js"></script>
    <script src="graph.js"></script>
</body>
</html>
